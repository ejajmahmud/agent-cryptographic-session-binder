[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cryptographic-session-binder"
version = "0.1.0"
description = "Cryptographic session binder signing and verifying all agent-to-tool message envelopes with ephemeral keys"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-cryptographic-session-binder = "agent_cryptographic_session_binder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_cryptographic_session_binder*"]
